basePath: /api
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handlers.LoginInput:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.BlogPost:
    properties:
      author:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      author_id:
        description: Foreign keys
        type: integer
      content:
        type: string
      content_type:
        description: Content format
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      excerpt:
        description: SEO and metadata
        type: string
      id:
        type: integer
      is_featured:
        type: boolean
      is_published:
        description: Publishing
        type: boolean
      meta_description:
        type: string
      meta_title:
        type: string
      published_at:
        type: string
      slug:
        type: string
      tags:
        description: Tags (stored as JSON array)
        items:
          type: string
        type: array
      title:
        description: Content
        type: string
      updated_at:
        type: string
      view_count:
        description: Statistics
        type: integer
    type: object
  models.BlogPostInput:
    properties:
      content:
        type: string
      content_type:
        type: string
      excerpt:
        type: string
      is_featured:
        type: boolean
      is_published:
        type: boolean
      meta_description:
        type: string
      meta_title:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - content
    - title
    type: object
  models.ContactSubmissionInput:
    properties:
      company:
        maxLength: 100
        type: string
      email:
        maxLength: 100
        type: string
      form_type:
        type: string
      message:
        maxLength: 2000
        type: string
      name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      subject:
        maxLength: 200
        type: string
      turnstile_token:
        type: string
    required:
    - email
    - message
    - name
    - subject
    - turnstile_token
    type: object
  models.Event:
    properties:
      created_at:
        type: string
      created_by:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      created_by_id:
        description: Foreign keys
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      end_date:
        type: string
      event_url:
        type: string
      extracted_data:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_all_day:
        type: boolean
      is_featured:
        type: boolean
      is_published:
        description: Status and visibility
        type: boolean
      organizer_name:
        description: Organizer information
        type: string
      organizer_url:
        type: string
      source_type:
        description: '"url", "image", "pdf"'
        type: string
      source_url:
        description: Metadata extraction info
        type: string
      start_date:
        description: Date and time
        type: string
      title:
        description: Event details
        type: string
      updated_at:
        type: string
    type: object
  models.EventInput:
    properties:
      description:
        type: string
      end_date:
        type: string
      event_url:
        type: string
      image_url:
        type: string
      is_all_day:
        type: boolean
      is_featured:
        type: boolean
      is_published:
        type: boolean
      organizer_name:
        type: string
      organizer_url:
        type: string
      source_type:
        type: string
      source_url:
        type: string
      start_date:
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - start_date
    - title
    type: object
  models.Session:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      expires_at:
        type: string
      id:
        type: integer
      ip_address:
        type: string
      session_id:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Belongs to User
      user_agent:
        type: string
      user_id:
        type: integer
    type: object
  models.User:
    properties:
      blog_posts:
        description: Blog posts created by this user
        items:
          $ref: '#/definitions/models.BlogPost'
        type: array
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      events:
        description: Events created by this user
        items:
          $ref: '#/definitions/models.Event'
        type: array
      id:
        type: integer
      is_admin:
        type: boolean
      sessions:
        description: Sessions for this user
        items:
          $ref: '#/definitions/models.Session'
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@pcafe2025.com
    name: API Support
    url: http://www.pcafe2025.com/support
  description: PCafe 2025 REST API for IoT data visualization, blog, and event management
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: PCafe 2025 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and create session
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Logout current user and clear session
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: User logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Get information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Extend the current session expiration time
      produces:
      - application/json
      responses:
        "200":
          description: Session refreshed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to refresh session
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Refresh session
      tags:
      - Auth
  /blog:
    get:
      description: Get a list of blog posts with optional filters
      parameters:
      - description: Filter by featured posts
        in: query
        name: featured
        type: boolean
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Search in title, content, and excerpt
        in: query
        name: search
        type: string
      - description: Number of posts to return (max 100)
        in: query
        name: limit
        type: integer
      - description: Number of posts to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of blog posts
          schema:
            items:
              $ref: '#/definitions/models.BlogPost'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List blog posts
      tags:
      - Blog
    post:
      consumes:
      - application/json
      description: Create a new blog post (admin only)
      parameters:
      - description: Blog post data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.BlogPostInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created blog post
          schema:
            $ref: '#/definitions/models.BlogPost'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Create a blog post
      tags:
      - Blog
  /blog/{id}:
    get:
      description: Get a blog post by ID or slug
      parameters:
      - description: Blog post ID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Blog post details
          schema:
            $ref: '#/definitions/models.BlogPost'
        "404":
          description: Blog post not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a blog post
      tags:
      - Blog
  /contact:
    post:
      consumes:
      - application/json
      description: Submit a contact form with Turnstile CAPTCHA verification
      parameters:
      - description: Contact form data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.ContactSubmissionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Contact submission created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request or invalid CAPTCHA
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit contact form
      tags:
      - Contact
  /events:
    get:
      description: Get a list of events with optional filters
      parameters:
      - description: Filter by featured events
        in: query
        name: featured
        type: boolean
      - description: Filter events starting from this date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter events ending before this date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Include past events (public users only)
        in: query
        name: include_past
        type: boolean
      - description: Number of events to return (max 100)
        in: query
        name: limit
        type: integer
      - description: Number of events to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of events with total count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Create a new event (admin only)
      parameters:
      - description: Event data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.EventInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created event
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Create an event
      tags:
      - Events
  /events/{id}:
    get:
      description: Get an event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Event details
          schema:
            $ref: '#/definitions/models.Event'
        "404":
          description: Event not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an event
      tags:
      - Events
    put:
      consumes:
      - application/json
      description: Update an existing event (admin only)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Event data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.EventInput'
      produces:
      - application/json
      responses:
        "200":
          description: Updated event
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Event not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Update an event
      tags:
      - Events
  /iot/data:
    get:
      description: Get time-series IoT sensor data with optional filters
      parameters:
      - description: Filter by device ID
        in: query
        name: device_id
        type: string
      - description: Filter by device type
        in: query
        name: device_type
        type: string
      - description: Filter by sensor type
        in: query
        name: sensor_type
        type: string
      - description: Filter by location
        in: query
        name: location
        type: string
      - description: Start time (RFC3339 format)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339 format)
        in: query
        name: end_time
        type: string
      - description: Number of records to return (max 10000)
        in: query
        name: limit
        type: integer
      - description: Number of records to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: IoT data with metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get IoT data
      tags:
      - IoT
  /iot/stats:
    get:
      description: Get aggregated statistics for IoT data
      parameters:
      - description: Filter by device ID
        in: query
        name: device_id
        type: string
      - description: Filter by device type
        in: query
        name: device_type
        type: string
      - description: Filter by sensor type
        in: query
        name: sensor_type
        type: string
      - description: Filter by location
        in: query
        name: location
        type: string
      - description: Start time (RFC3339 format)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339 format)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: IoT statistics
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get IoT statistics
      tags:
      - IoT
securityDefinitions:
  SessionAuth:
    in: cookie
    name: session
    type: apiKey
swagger: "2.0"
