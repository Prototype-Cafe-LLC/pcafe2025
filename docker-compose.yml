version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: pcafe2025_postgres
    environment:
      POSTGRES_DB: pcafe2025
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - pcafe_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pcafe2025"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcafe2025_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pcafe2025
      DB_USER: postgres
      DB_PASSWORD: password
      SERVER_PORT: 8080
      ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    networks:
      - pcafe_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["backend"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcafe2025_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - pcafe_network
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["frontend"]

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pcafe2025_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pcafe.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pcafe_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["pgadmin"]

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pcafe_network:
    driver: bridge